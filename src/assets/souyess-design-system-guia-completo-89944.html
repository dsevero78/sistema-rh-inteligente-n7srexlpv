<html>

    <meta charset="utf-8" />
    <title>SouYess Design System — Guia</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #212b55;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;

          13px/1.4 -apple-system,

        background: #fff;

        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;

        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;

        align-items: center;

        z-index: 9999;

        width: 100%;
        height: 100%;
        object-fit: contain;
      }

        >

    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        const loading = document.getElementById('__bundler_loading')
        function setStatus(msg) {
          if (loading) loading.textContent = msg
        }

        const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/
        function toBase64(bytes) {
          let bin = ''
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
          }
          return btoa(bin)
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          'error',
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                '[bundle] resource failed to load:',
                e.target.tagName,
                String(e.target.src || e.target.href || ''),
              )
              return
            }
            var p = document.body || document.documentElement
            var d =
              document.getElementById('__bundler_err') ||
              p.appendChild(document.createElement('div'))
            d.id = '__bundler_err'
            d.style.cssText =
              'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto'
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
              '[bundle] ' +
              (e.message || e.type) +
              (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '')
          },
          true,
        )

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]')
          const templateEl = document.querySelector('script[type="__bundler/template"]')
          if (!manifestEl || !templateEl) {
            setStatus('Error: missing bundle data')
            console.error(
              '[bundler] Missing script tags — manifestEl:',
              !!manifestEl,
              'templateEl:',
              !!templateEl,
            )
            return
          }

          const manifest = JSON.parse(manifestEl.textContent)
          let template = JSON.parse(templateEl.textContent)

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]')
          const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : []
          const pageSet = new Set(pageOrder)
          const pageTexts = {}

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '') ? window.origin : '*'
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === 'null' &&
                (window.origin === 'file://' || window.location.protocol === 'file:')) ||
              (/^file:/.test(e.origin) && window.origin === 'null')
            )
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0
          const blobUrls = {}
          const resourceBlobs = {}
          const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/
          const pendingFrames = {} // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {} // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: 'text/html' })
            const u = URL.createObjectURL(pageBlob)
            resourceBlobs[u] = pageBlob
            el.src = u + frag
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid]
            delete pendingFrames[uuid]
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text)
            const relays = pendingRelays[uuid]
            delete pendingRelays[uuid]
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET)
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = []
            for (const f of Array.from(document.querySelectorAll('iframe'))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow)
              } catch (err) {
                /* detached */
              }
            }
            return out
          }
          window.addEventListener('message', function (e) {
            const d = e.data
            if (!d || typeof d !== 'object' || !e.source) return
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return
            if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return
              const uuid = d.__bundler_need
              const text = pageTexts[uuid]
              if (typeof text === 'string') {
                try {
                  e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET)
                } catch (err) {
                  /* gone */
                }
                return
              }
              if (isPageRoot || window.parent === window) return // authoritative miss
              const waiting = pendingRelays[uuid]
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source)
                return
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return
              pendingRelays[uuid] = [e.source]
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET)
            } else if (
              typeof d.__bundler_page === 'string' &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === 'string'
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window) return
              if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays))
                return
              deliverPage(d.__bundler_page, d.__bundler_text)
            }
          })

          const uuids = Object.keys(manifest)
          setStatus('Unpacking ' + uuids.length + ' assets...')

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid]
              try {
                const binaryStr = atob(entry.data)
                const bytes = new Uint8Array(binaryStr.length)
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i)

                let finalBytes = bytes
                if (entry.compressed) {
                  if (typeof DecompressionStream !== 'undefined') {
                    const ds = new DecompressionStream('gzip')
                    const writer = ds.writable.getWriter()
                    const reader = ds.readable.getReader()
                    writer.write(bytes)
                    writer.close()
                    const chunks = []
                    let totalLen = 0
                    while (true) {
                      const { done, value } = await reader.read()
                      if (done) break
                      chunks.push(value)
                      totalLen += value.length
                    }
                    finalBytes = new Uint8Array(totalLen)
                    let offset = 0
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset)
                      offset += chunk.length
                    }
                  } else {
                    console.warn(
                      'DecompressionStream not available, asset ' + uuid + ' may not render',
                    )
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes)
                  return
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    'data:' +
                    entry.mime +
                    ';base64,' +
                    (entry.compressed ? toBase64(finalBytes) : entry.data)
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime })
                  blobUrls[uuid] = URL.createObjectURL(blob)
                  resourceBlobs[blobUrls[uuid]] = blob
                }
              } catch (err) {
                console.error('Failed to decode asset ' + uuid + ':', err)
                const blob = new Blob([], { type: entry.mime })
                blobUrls[uuid] = URL.createObjectURL(blob)
                resourceBlobs[blobUrls[uuid]] = blob
              }
            }),
          )

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]')
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : []
          const resourceMap = {}
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid]
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs

          setStatus('Rendering...')
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue
            template = template.split(uuid).join(blobUrls[uuid])
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, '')
            .replace(/\s+crossorigin="[^"]*"/gi, '')

          const resourceScript =
            '<script>window.__resources = ' +
            JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
            ';</' +
            'script>'
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i)
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length
            template = template.slice(0, i) + resourceScript + template.slice(i)
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, 'text/html')
          document.documentElement.replaceWith(doc.documentElement)

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/
            const needed = []
            for (const el of Array.from(document.querySelectorAll('iframe'))) {
              const m = MARKER.exec(el.getAttribute('src') || '')
              if (!m) continue
              const text = pageTexts[m[1]]
              if (typeof text === 'string') {
                mountPage(el, m[2] || '', text)
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]]
                ;(pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' })
                if (!had) needed.push(m[1])
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET)
            }
          }

          const dead = Array.from(document.scripts)
          for (const old of dead) {
            const s = document.createElement('script')
            for (const a of old.attributes) s.setAttribute(a.name, a.value)
            s.textContent = old.textContent
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
              const pre = resourceBlobs[s.src.split('#')[0]]
              s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text()
              s.removeAttribute('src')
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r
                })
              : null
            old.replaceWith(s)
            if (p) await p
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            window.Babel.transformScriptTags()
          }
        } catch (err) {
          setStatus('Error unpacking: ' + err.message)
          console.error('Bundle unpack error:', err)
        }
      })
    </script>

==========================\n * OFFICIAL TYPEFACE — GOTHAM (Hoefler & Co.)\n * Gotham is a commercial face and cannot be bundled/redistributed\n * here, so it is declared via local() — it loads automatically for\n * anyone with Gotham licensed/installed, and otherwise falls through\n * to Montserrat in the font stack (see --font-display / --font-body).\n *\n * TO GO PIXEL-TRUE: drop the licensed Gotham web-font files into\n * fonts/ and uncomment the url() lines below (keep the local() first\n * so installed copies still win). Do NOT swap in another family.\n * ============================================================ */\n@font-face {\n  font-family: 'Gotham';\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n  src: local('Gotham Light'), local('Gotham-Light');\n       /* , url('fonts/Gotham-Light.woff2') format('woff2') */\n}\n@font-face {\n  font-family: 'Gotham';\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: local('Gotham Book'), local('Gotham-Book'), local('Gotham');\n       /* , url('fonts/Gotham-Book.woff2') format('woff2') */\n}\n@font-face {\n  font-family: 'Gotham';\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: local('Gotham Medium'), local('Gotham-Medium');\n       /* , url('fonts/Gotham-Medium.woff2') format('woff2') */\n}\n@font-face {\n  font-family: 'Gotham';\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n  src: local('Gotham Bold'), local('Gotham-Bold');\n       /* , url('fonts/Gotham-Bold.woff2') format('woff2') */\n}\n@font-face {\n  font-family: 'Gotham';\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n  src: local('Gotham Black'), local('Gotham-Black');\n       /* , url('fonts/Gotham-Black.woff2') format('woff2') */\n}\n\n:root {\n  /* --- Brand palette (OFFICIAL) ----------------------------- */\n  /* Laranja — primary brand color. Official #E9530E */\n  --orange-50:  #FEF1EA;\n  --orange-100: #FBDCC9;\n  --orange-200: #F6BC97;\n  --orange-300: #F19763;\n  --orange-400: #ED7338;\n  --orange-500: #E9530E;     /* SouYess Laranja — OFFICIAL */\n  --orange-600: #C5430A;     /* hover / pressed */\n  --orange-700: #9B340A;\n  --orange-800: #6F2608;\n\n  /* Azul profundo — primary brand navy. Official #212B55 */\n  --navy-50:  #ECEEF4;\n  --navy-100: #D3D7E5;\n  --navy-200: #A8B0C9;\n  --navy-300: #7480A6;\n  --navy-400: #4A567E;\n  --navy-600: #2E3A6E;       /* hover navy */\n  --navy-700: #212B55;       /* SouYess Azul Profundo — OFFICIAL */\n  --navy-800: #1A2240;       /* dark surface */\n  --navy-900: #11162B;       /* near-black deep ink */\n\n  /* Azul aceso — bright accent blue for dark/organogram layouts. Official #345EA9 */\n  --blue-50:  #EDF2F9;\n  --blue-100: #D7E0F0;\n  --blue-400: #4F76BC;\n  --blue-500: #345EA9;       /* SouYess Azul Aceso — OFFICIAL */\n  --blue-600: #2A4D8C;\n\n  /* --- Neutral / surface ------------------------------------ */\n  --white:    #FFFFFF;\n  --off-white:#F7F8FB;\n  --gray-50:  #F2F4F8;\n  --gray-100: #E7EAF0;\n  --gray-200: #D7DCE6;\n  --gray-300: #BFC5D2;\n  --gray-400: #98A0B0;\n  --gray-500: #6B7384;\n  --gray-600: #4D5566;\n  --gray-700: #353C4D;\n  --gray-800: #1F2435;\n  --black:    #0A0E1A;\n\n  /* --- Semantic foreground / background --------------------- */\n  --bg-canvas:    var(--white);\n  --bg-surface:   var(--white);\n  --bg-subtle:    var(--off-white);\n  --bg-muted:     var(--gray-50);\n  --bg-dark:      var(--navy-700);     /* navy hero surface */\n  --bg-darker:    var(--navy-900);     /* near-black surface */\n  --bg-tint:      var(--orange-50);    /* lightest brand tint */\n\n  --fg-primary:   var(--navy-900);     /* default ink on light */\n  --fg-secondary: var(--gray-600);     /* body / supporting copy */\n  --fg-muted:     var(--gray-500);     /* meta / captions */\n  --fg-disabled:  var(--gray-400);\n  --fg-inverse:   var(--white);        /* ink on dark */\n  --fg-brand:     var(--orange-500);   /* accent ink */\n  --fg-on-navy:   var(--white);\n\n  --border-subtle: var(--gray-100);\n  --border-default: var(--gray-200);\n  --border-strong: var(--gray-300);\n  --border-brand: var(--orange-500);\n  --border-focus: var(--orange-500);\n\n  /* --- Status (product UI only) ----------------------------- */\n  --success-500: #1F9D6A;\n  --success-100: #DDF3E8;\n  --warning-500: #E5A700;\n  --warning-100: #FBF1D2;\n  --danger-500:  #D5392C;\n  --danger-100:  #F8DDD9;\n  --info-500:    #3B6FE0;\n  --info-100:    #DCE6FA;\n\n  /* --- Typography ------------------------------------------- */\n  /* OFFICIAL display + text face is GOTHAM (Light→Black + italics).\n   * Gotham is a commercial face (Hoefler&Co) and is NOT web-free, so\n   * it is listed FIRST — used when licensed/installed locally — with\n   * Montserrat as the closest free geometric fallback loaded above.\n   * Drop Gotham web fonts into fonts/ and @font-face them to go pixel-true. */\n  --font-display: 'Gotham', 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-body:    'Gotham', 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* fluid base — body min 16px on web, 24px on slides handled inline */\n  --text-xs:   12px;\n  --text-sm:   14px;\n  --text-base: 16px;\n  --text-md:   18px;\n  --text-lg:   20px;\n  --text-xl:   24px;\n  --text-2xl:  30px;\n  --text-3xl:  38px;\n  --text-4xl:  48px;\n  --text-5xl:  64px;\n  --text-6xl:  80px;\n\n  --leading-tight:  1.15;\n  --leading-snug:   1.25;\n  --leading-normal: 1.5;\n  --leading-loose:  1.65;\n\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-wider:  0.08em;   /* canonical for ALL CAPS display */\n  --tracking-widest: 0.16em;   /* canonical for tiny eyebrow labels */\n\n  --weight-regular: 400;\n  --weight-medium:  500;\n  --weight-semi:    600;\n  --weight-bold:    700;\n  --weight-black:   800;\n\n  /* --- Spacing (8pt grid) ----------------------------------- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* --- Radius ----------------------------------------------- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;     /* button, input, chip */\n  --radius-md:   12px;    /* card */\n  --radius-lg:   16px;    /* hero card / modal */\n  --radius-xl:   24px;    /* feature surface */\n  --radius-pill: 999px;\n\n  /* --- Shadow / elevation ----------------------------------- */\n  --shadow-xs: 0 1px 1px rgba(11, 18, 48, 0.04);\n  --shadow-sm: 0 1px 2px rgba(11, 18, 48, 0.06), 0 1px 3px rgba(11, 18, 48, 0.08);\n  --shadow-md: 0 6px 16px rgba(11, 18, 48, 0.10), 0 2px 4px rgba(11, 18, 48, 0.06);\n  --shadow-lg: 0 16px 32px rgba(11, 18, 48, 0.12), 0 4px 8px rgba(11, 18, 48, 0.06);\n  --shadow-focus: 0 0 0 2px var(--white), 0 0 0 4px var(--orange-500);\n\n  /* --- Motion ----------------------------------------------- */\n  --ease-default: cubic-bezier(0.32, 0.72, 0, 1); /* @kind other */\n  --ease-in:      cubic-bezier(0.4, 0, 1, 1);      /* @kind other */\n  --ease-out:     cubic-bezier(0, 0, 0.2, 1);      /* @kind other */\n  --duration-fast:   120ms; /* @kind other */\n  --duration-base:   200ms; /* @kind other */\n  --duration-slow:   320ms; /* @kind other */\n  --duration-slower: 500ms; /* @kind other */\n\n  /* --- Layout ----------------------------------------------- */\n  --content-narrow: 720px;\n  --content-default: 1080px;\n  --content-wide: 1280px;\n  --gutter: 24px;\n}\n\n/* ============================================================\n * Base reset + element styles\n * ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--bg-canvas);\n  color: var(--fg-primary);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--orange-500);\n  color: var(--white);\n}\n\n/* Display headlines — ALL CAPS by default at h1/h2. h3/h4 stay sentence case. */\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  color: var(--fg-primary);\n  margin: 0 0 var(--space-3);\n  line-height: var(--leading-tight);\n  text-wrap: balance;\n}\n\nh1 {\n  font-size: var(--text-5xl);\n  font-weight: var(--weight-black);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n}\n\nh2 {\n  font-size: var(--text-3xl);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n}\n\nh3 {\n  font-size: var(--text-xl);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-normal);\n}\n\nh4 {\n  font-size: var(--text-md);\n  font-weight: var(--weight-semi);\n  letter-spacing: var(--tracking-normal);\n}\n\nh5 {\n  font-size: var(--text-base);\n  font-weight: var(--weight-semi);\n  letter-spacing: var(--tracking-normal);\n}\n\n/* Eyebrow / kicker label */\n.eyebrow {\n  font-family: var(--font-display);\n  font-size: var(--text-xs);\n  font-weight: var(--weight-bold);\n  letter-spacing: var(--tracking-widest);\n  text-transform: uppercase;\n  color: var(--fg-brand);\n}\n\np {\n  margin: 0 0 var(--space-3);\n  color: var(--fg-secondary);\n  line-height: var(--leading-normal);\n  text-wrap: pretty;\n}\n\n/* Body lead — used for the longer descriptive paragraphs in the deck */\n.lead {\n  font-size: var(--text-md);\n  color: var(--fg-primary);\n  line-height: var(--leading-normal);\n}\n\na {\n  color: var(--navy-700);\n  text-decoration: none;\n  transition: color var(--duration-base) var(--ease-default);\n}\na:hover { color: var(--orange-500); text-decoration: underline; text-underline-offset: 3px; }\n\nstrong, b { font-weight: var(--weight-bold); color: var(--fg-primary); }\nem, i { font-style: italic; }\n\ncode, kbd, samp, pre {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n}\ncode {\n  background: var(--gray-50);\n  padding: 0.1em 0.4em;\n  border-radius: var(--radius-xs);\n  color: var(--navy-700);\n}\n\nhr {\n  border: 0;\n  border-top: 1px solid var(--border-subtle);\n  margin: var(--space-5) 0;\n}\n\n/* On dark surfaces */\n.surface-dark {\n  background: var(--bg-dark);\n  color: var(--fg-on-navy);\n}\n.surface-dark h1, .surface-dark h2, .surface-dark h3, .surface-dark h4 { color: var(--fg-on-navy); }\n.surface-dark p { color: rgba(255,255,255,0.78); }\n.surface-dark .eyebrow { color: var(--orange-500); }\n\n/* Focus ring — accessibility-first */\n:focus-visible {\n  outline: 2px solid var(--orange-500);\n  outline-offset: 2px;\n  border-radius: var(--radius-xs);\n}\n<\u002Fstyle>\n<style>\nbody{background:var(--off-white);color:var(--fg-primary)}\na,a:visited{color:var(--orange-600);text-decoration:none;border-bottom:1px solid var(--orange-200)}\na:hover{color:var(--orange-500);border-bottom-color:var(--orange-500)}\n.wrap{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start;max-width:1440px;margin:0 auto}\nnav.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:32px 20px;border-right:1px solid var(--border-subtle);background:var(--white)}\nnav.side .brand{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-700);margin-bottom:4px}\nnav.side .sub{font-size:11px;color:var(--fg-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px}\nnav.side .grp{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin:20px 0 8px}\nnav.side a{display:block;padding:6px 10px;border-radius:6px;border:0;font-size:13.5px;color:var(--navy-700)}\nnav.side a:hover{background:var(--orange-50);color:var(--orange-600)}\nmain{padding:0 0 120px}\nsection{padding:56px 56px 8px;scroll-margin-top:24px}\nh2.sec{font-size:var(--text-2xl);margin-bottom:8px}\n.lead{font-size:15.5px;color:var(--fg-secondary);max-width:66ch;margin-bottom:32px}\n.eyebrow{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-500);margin-bottom:10px}\nh3.sub{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-700);margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle)}\n.hero{background:var(--navy-700);color:var(--fg-inverse);padding:64px 56px;position:relative;overflow:hidden}\n.hero .geo1{position:absolute;top:0;right:0;width:190px;height:190px;background:var(--orange-500);border-radius:0 0 0 190px;z-index:0}\n.hero .geo2{position:absolute;top:118px;right:66px;width:82px;height:82px;border-radius:999px;border:6px solid var(--orange-500);background:var(--navy-700);z-index:0}\n.hero img{position:relative;z-index:1;height:34px;width:auto;display:block;margin-bottom:28px}\n.hero h1{position:relative;z-index:1;font-size:var(--text-4xl);color:#fff;margin-bottom:14px;max-width:calc(100% - 240px)}\n.hero p{position:relative;max-width:56ch;color:rgba(255,255,255,.76);font-size:16px}\n.ramp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:2px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:20px}\n.ramp .sw{padding:12px 10px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}\n.ramp .sw b{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em}\n.ramp .sw code{font-family:var(--font-mono);font-size:10px;opacity:.85}\n.ramp .sw.official::before{content:\"OFICIAL\";font-family:var(--font-display);font-size:8px;font-weight:700;letter-spacing:.14em;margin-bottom:auto}\n us\"><\u002Fscript>\n<script src=\"ef2e8c35-e4bf-4322-a6d4-23a759018ae9\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"5c597ef3-e3ce-45a9-b372-3b05baef1562\"><\u002Fscript>\n<script src=\"b392bfae-8cc8-45d2-ad59-a90515dbbc16\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n<nav class=\"side\">\n  <div class=\"brand\">SouYess<\u002Fdiv>\n  <div class=\"sub\">Design System · Guia<\u002Fdiv>\n  <div class=\"grp\">Começar<\u002Fdiv>\n  <a href=\"#uso\">Como usar<\u002Fa>\n  <a href=\"#fontes\">Tipografia licenciada<\u002Fa>\n  <div class=\"grp\">Fundamentos<\u002Fdiv>\n  <a href=\"#cores\">Cores da marca<\u002Fa>\n  <a href=\"#neutros\">Neutros<\u002Fa>\n  <a href=\"#semantico\">Tokens semânticos<\u002Fa>\n  <a href=\"#status\">Status<\u002Fa>\n  <a href=\"#tipografia\">Tipografia<\u002Fa>\n  <a href=\"#espaco\">Espaçamento<\u002Fa>\n  <a href=\"#raio\">Raio &amp; sombra<\u002Fa>\n  <a href=\"#motion\">Movimento<\u002Fa>\n  <div class=\"grp\">Componentes<\u002Fdiv>\n  <a href=\"#c-button\">Button<\u002Fa>\n  <a href=\"#c-field\">Field<\u002Fa>\n  <a href=\"#c-statuschip\">StatusChip<\u002Fa>\n  <a href=\"#c-kpicard\">KpiCard<\u002Fa>\n  <a href=\"#c-debitrow\">DebitRow<\u002Fa>\n  <a href=\"#c-heropanel\">HeroPanel<\u002Fa>\n  <a href=\"#c-topbar\">TopBar<\u002Fa>\n  <a href=\"#c-siderail\">SideRail<\u002Fa>\n<\u002Fnav>\n<main>\n  <header class=\"hero\">\n    <div class=\"geo1\"><\u002Fdiv>\n    <div class=\"geo2\"><\u002Fdiv>\n    <img src=\"ef1c8281-9d23-4ae3-a41e-16eb5eaf855e\" alt=\"SouYess\">\n    <h1>Design System<\u002Fh1>\n    <p>Referência única e offline dos fundamentos visuais do Grupo SouYess e do kit de produto SIGCORP — cores oficiais, tipografia, escala, e os oito componentes prontos para reuso em outros projetos.<\u002Fp>\n  <\u002Fheader>\n\n  <section id=\"uso\">\n    <div class=\"eyebrow\">Começar<\u002Fdiv>\n    <h2 class=\"sec\">Como usar em outro projeto<\u002Fh2>\n    <p class=\"lead\">Dois arquivos bastam: a folha de tokens e o bundle compilado. Os componentes ficam disponíveis num namespace global — não há build step, npm ou import.<\u002Fp>\n    <pre><span class=\"c\">&lt;!-- 1. tokens: variáveis CSS, reset e estilos de base --&gt;<\u002Fspan>\n&lt;<span class=\"k\">link<\u002Fspan> rel=<span class=\"s\">\"stylesheet\"<\u002Fspan> href=<span class=\"s\">\"colors_and_type.css\"<\u002Fspan>&gt;\n\n<span class=\"c\">&lt;!-- 2. React (os componentes são componentes React) --&gt;<\u002Fspan>\n&lt;<span class=\"k\">script<\u002Fspan> src=<span class=\"s\">\"react.development.js\"<\u002Fspan>&gt;&lt;/<span class=\"k\">script<\u002Fspan>&gt;\n&lt;<span class=\"k\">script<\u002Fspan> src=<span class=\"s\">\"react-dom.development.js\"<\u002Fspan>&gt;&lt;/<span class=\"k\">script<\u002Fspan>&gt;\n\n<span class=\"c\">&lt;!-- 3. ícones lucide (usados por Button, TopBar, SideRail, DebitRow) --&gt;<\u002Fspan>\n&lt;<span class=\"k\">script<\u002Fspan> src=<span class=\"s\">\"https://unpkg.com/lucide@latest\"<\u002Fspan>&gt;&lt;/<span class=\"k\">script<\u002Fspan>&gt;\n\n<span class=\"c\">&lt;!-- 4. o design system compilado --&gt;<\u002Fspan>\n&lt;<span class=\"k\">script<\u002Fspan> src=<span class=\"s\">\"_ds_bundle.js\"<\u002Fspan>&gt;&lt;/<span class=\"k\">script<\u002Fspan>&gt;<\u002Fpre>\n    <pre><span class=\"c\">// os oito componentes saem do namespace global<\u002Fspan>\n<span class=\"k\">const<\u002Fspan> { Button, Field, StatusChip, KpiCard,\n        DebitRow, HeroPanel, TopBar, SideRail } = window.SouYessDesignSystem_019e08;\n\n<span class=\"c\">// depois de renderizar, ativar os ícones uma vez<\u002Fspan>\nlucide.createIcons({ attrs: { <span class=\"s\">'stroke-width'<\u002Fspan>: 2 } });<\u002Fpre>\n    <div class=\"note\"><strong>Regra de ouro:<\u002Fstrong> nunca escreva valores de cor, fonte, espaço ou raio direto no CSS. Use sempre as variáveis (<code>var(--orange-500)<\u002Fcode>, <code>var(--space-5)<\u002Fcode>) — é o que mantém os produtos SouYess consistentes entre si.<\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"fontes\">\n    <div class=\"eyebrow\">Começar<\u002Fdiv>\n    <h2 class=\"sec\">Tipografia licenciada<\u002Fh2>\n    <p class=\"lead\">A face oficial é a <strong>Gotham<\u002Fstrong> (Hoefler&nbsp;&amp;&nbsp;Co.) — comercial, não redistribuível. O sistema a declara primeiro e usa <strong>Montserrat<\u002Fstrong> como substituta geométrica gratuita quando a Gotham não está instalada.<\u002Fp>\n    <div class=\"note\">Para ficar pixel-true: coloque os arquivos licenciados (<code>.woff2<\u002Fcode>) em <code>fonts/<\u002Fcode> e ative os blocos <code>@font-face<\u002Fcode> já preparados no fim de <code>colors_and_type.css<\u002Fcode>. Sem isso, tudo continua funcionando com Montserrat.<\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cores\"><div class=\"eyebrow\">Fundamentos<\u002Fdiv><h2 class=\"sec\">Cores da marca<\u002Fh2>\n    <p class=\"lead\">Três famílias oficiais. O laranja é a cor de ação e destaque; o azul profundo é a superfície institucional; o azul aceso serve a layouts escuros e organogramas.<\u002Fp>\n    <div id=\"brandramps\"><\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"neutros\"><h3 class=\"sub\">Neutros / superfície<\u002Fh3><div id=\"neutralramp\"><\u002Fdiv><\u002Fsection>\n  <section id=\"semantico\"><h3 class=\"sub\">Tokens semânticos<\u002Fh3>\n    <p class=\"lead\">Use estes, não os degraus crus — eles carregam a intenção e sobrevivem a mudanças de paleta.<\u002Fp>\n    <div id=\"semantic\"><\u002Fdiv><\u002Fsection>\n  <section id=\"status\"><h3 class=\"sub\">Status (apenas UI de produto)<\u002Fh3><div id=\"statustok\"><\u002Fdiv><\u002Fsection>\n\n  <section id=\"tipografia\"><div class=\"eyebrow\">Fundamentos<\u002Fdiv><h2 class=\"sec\">Tipografia<\u002Fh2>\n    <p class=\"lead\">H1 e H2 são caixa-alta com <code>letter-spacing: .08em<\u002Fcode>; H3+ ficam em caixa-baixa. Rótulos micro usam <code>.16em<\u002Fcode>. Corpo de texto nunca abaixo de 16px na web.<\u002Fp>\n    <div id=\"typescale\"><\u002Fdiv>\n    <h3 class=\"sub\">Pesos &amp; tracking<\u002Fh3><div id=\"typetok\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"espaco\"><div class=\"eyebrow\">Fundamentos<\u002Fdiv><h2 class=\"sec\">Espaçamento<\u002Fh2>\n    <p class=\"lead\">Grade de 8pt. Prefira <code>gap<\u002Fcode> em flex/grid em vez de margens soltas.<\u002Fp>\n    <div class=\"card\" id=\"spacing\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"raio\"><h3 class=\"sub\">Raio<\u002Fh3><div class=\"rad\" id=\"radius\"><\u002Fdiv>\n    <h3 class=\"sub\">Elevação<\u002Fh3><div class=\"shad\" id=\"shadow\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"motion\"><div class=\"eyebrow\">Fundamentos<\u002Fdiv><h2 class=\"sec\">Movimento<\u002Fh2>\n    <p class=\"lead\">Uma curva padrão para tudo, quatro durações. Transições de interface usam <code>--duration-base<\u002Fcode>.<\u002Fp>\n    <div id=\"motiontok\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"componentes\"><div class=\"eyebrow\">Kit SIGCORP<\u002Fdiv><h2 class=\"sec\">Componentes<\u002Fh2>\n    <p class=\"lead\">Oito componentes React tipados, extraídos da plataforma tributária municipal SIGCORP. Cada um lê apenas tokens — herdam a marca automaticamente.<\u002Fp>\n    <div id=\"components\"><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n<script>\nconst NS = window.SouYessDesignSystem_019e08 || {};\nconst h = React.createElement;\nconst css = getComputedStyle(document.documentElement);\nconst val = n => css.getPropertyValue(n).trim();\n\nfunction ramp(title, rows, dark) {\n  return h('div', { key: title },\n    h('h3', { className: 'sub' }, title),\n    h('div', { className: 'ramp' }, rows.map(([n, official]) => {\n      const v = val(n);\n      const step = parseInt(n.split('-').pop(), 10) || 0;\n      const light = step <= 300;\n      return h('div', {\n        key: n,\n        className: 'sw' + (official ? ' offici
